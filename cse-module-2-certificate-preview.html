  <style>
    :root{--navy:#123a73;--navy-dark:#0c2951;--gold:#c9a24a;--line:#d6dde8;--ink:#1f2f46;--muted:#5d6c81}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(180deg,#eef3f9,#f7f8fb);color:var(--ink);padding:1.2rem}.top-actions{max-width:1120px;margin:0 auto 1rem;display:flex;gap:.7rem;justify-content:space-between;align-items:center;flex-wrap:wrap}.button{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:.8rem 1.1rem;font-weight:800;text-decoration:none;cursor:pointer}.primary{background:var(--navy);color:#fff}.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}.certificate{position:relative;width:1120px;max-width:100%;margin:0 auto;background:#fff;border:12px solid var(--navy);border-radius:22px;box-shadow:0 30px 70px rgba(18,58,115,.18);overflow:hidden}.certificate:before{content:"";position:absolute;inset:16px;border:2px solid rgba(201,162,74,.65);border-radius:14px;pointer-events:none}.inner{position:relative;z-index:1;padding:1.45rem 2.3rem 1.5rem}.top{display:flex;justify-content:space-between;align-items:center;gap:1.2rem;border-bottom:1px solid #e8edf5;padding-bottom:.85rem}.brand{display:flex;align-items:center;gap:.8rem}.brand img{width:70px;height:70px;object-fit:contain;border-radius:50%;background:#fff}.brand strong{display:block;color:var(--navy-dark);font-size:1.25rem}.brand span{display:block;color:var(--muted);margin-top:.15rem;font-size:.9rem}.tag{padding:.55rem .8rem;border-radius:999px;background:#eef4ff;color:var(--navy);font-weight:800;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}.content{text-align:center;padding:1.3rem 0 1rem}.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.22em;font-weight:800;font-size:.78rem}.title{margin:.55rem 0 0;font-family:"Playfair Display",Georgia,serif;color:var(--navy-dark);font-size:3.15rem;line-height:1.05}.subtitle{max-width:720px;margin:.65rem auto 0;color:var(--muted);line-height:1.5;font-size:.92rem}.learner{margin:1rem 0 0;font-family:"Playfair Display",Georgia,serif;color:var(--navy);font-size:2.25rem;line-height:1.05}.line{width:500px;max-width:80%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:.45rem auto .75rem}.statement{max-width:820px;margin:.65rem auto 0;line-height:1.55;font-size:.92rem}.statement strong{color:var(--navy-dark)}.pill{display:inline-block;margin-top:.8rem;padding:.55rem .9rem;border-radius:999px;background:#faf6eb;border:1px solid rgba(201,162,74,.45);color:var(--navy-dark);font-weight:700;font-size:.9rem}.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.75rem;margin-top:1.15rem}.meta-card{padding:.8rem .7rem;border:1px solid var(--line);border-radius:12px;background:#fbfcfe}.meta-card span{display:block;color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800}.meta-card strong{display:block;color:var(--navy-dark);margin-top:.3rem;font-size:.86rem;line-height:1.3}.bottom{display:grid;grid-template-columns:1.05fr .95fr;gap:1rem;align-items:end;margin-top:1.2rem;padding-top:1rem;border-top:1px solid #e8edf5}.verify{text-align:left;color:var(--muted);line-height:1.45;font-size:.86rem}.verify strong{display:block;color:var(--navy-dark);margin-bottom:.25rem}.verify a{color:var(--navy);font-weight:800}.sig{text-align:center;justify-self:end;min-width:270px}.sig img{max-width:210px;max-height:66px;width:auto;height:auto;object-fit:contain;filter:contrast(1.1)}.sig-line{height:1px;background:#cad5e4;margin:.25rem 0 .45rem}.sig strong{display:block;color:var(--navy-dark);font-size:.95rem}.sig span{display:block;color:var(--muted);margin-top:.15rem;line-height:1.35;font-size:.82rem}.footer{margin-top:.9rem;padding-top:.55rem;border-top:1px dashed #d9e1ed;text-align:center;color:var(--muted);font-size:.72rem;line-height:1.4}.missing{max-width:900px;margin:2rem auto;padding:1.5rem;border:1px solid #f1c6c6;border-radius:1.2rem;background:#fff1f1;color:#8a1f1f}.download-note{max-width:1120px;margin:.8rem auto 0;color:var(--muted);font-size:.9rem;text-align:center}.registry-status{max-width:1120px;margin:.7rem auto 0;padding:.7rem 1rem;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font-size:.86rem;text-align:center}.registry-status strong{color:var(--navy-dark)}@media(max-width:860px){body{padding:.8rem}.inner{padding:1.2rem}.top,.bottom{display:grid;grid-template-columns:1fr}.brand{justify-content:center;text-align:center;flex-direction:column}.tag{justify-self:center}.meta{grid-template-columns:repeat(2,minmax(0,1fr))}.verify,.sig{text-align:center;justify-self:center}.title{font-size:2.25rem}.learner{font-size:1.85rem}.registry-status{border-radius:1rem}}@page{size:A4 landscape;margin:6mm}@media print{body{background:#fff;padding:0}.top-actions,.download-note,.registry-status{display:none}.certificate{width:100%;max-width:100%;border-radius:0;box-shadow:none;border-width:8px}.certificate:before{inset:10px}.inner{padding:1rem 1.5rem}.title{font-size:2.8rem}.learner{font-size:2rem}.footer{font-size:.65rem}}
   .preview-note{max-width:1120px;margin:1rem auto;padding:1rem 1.15rem;background:#fffaf2;color:#695017;border-left:5px solid #c9a24a;border-radius:12px;font-weight:700} .certificate{position:relative} .preview-watermark{position:absolute;z-index:3;left:6%;right:6%;top:43%;text-align:center;transform:rotate(-15deg);font-size:clamp(1.5rem,5vw,4rem);font-weight:900;letter-spacing:.07em;color:rgba(140,32,25,.23);pointer-events:none;text-transform:uppercase} .meta-card strong{overflow-wrap:anywhere} </style>

<p class="preview-note">Certificate design preview only. No unique certificate ID, download, registry submission, or formal verification is enabled. Unit 1 certificates remain unaffected.</p>
<div id="certificateHost"></div>
<script>
(function(){
 "use strict";
 function read(key){try{return JSON.parse(localStorage.getItem(key)||"null")}catch(e){return null}}
 function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
 const reg=read("ehsp_cse_module_2_registration"),result=read("ehsp_cse_module_2_result");
 const name=reg&&reg.fullName?escapeHtml(reg.fullName):"Sample Learner";
 const score=result&&result.pass&&result.moduleId==="module-2"?result.score+" out of 20":"Sample score: 15 out of 20";
 const host=document.getElementById("certificateHost");
 host.innerHTML='<section class="certificate" id="certificateCanvas" aria-label="Non-credential Unit 2 certificate design preview"><div class="preview-watermark">PREVIEW ONLY · NOT ISSUED</div><div class="inner"><div class="top"><div class="brand"><img src="assets/ehsp-logo.png" alt="Enamul Haque Skill Passport logo"/><div><strong>Enamul Haque Skill Passport</strong><span>Free Open Learning Recognition Initiative</span></div></div><div class="tag">Certificate Design Preview</div></div><div class="content"><div class="eyebrow">Open Learning Recognition</div><h1 class="title">Certificate of Achievement</h1><p class="subtitle">Proposed layout — not a valid certificate or proof of passing an officially assessed examination.</p><div class="learner">'+name+'</div><div class="line"></div><p class="statement">has demonstrated understanding of <strong>Unit 2: Data and Analysis (ICT)</strong> in the <strong>CSE For Non CSE Students</strong> learning pathway (preview text).</p><div class="pill">'+escapeHtml(score)+'</div><div class="meta"><div class="meta-card"><span>Course</span><strong>CSE For Non CSE Students</strong></div><div class="meta-card"><span>Unit</span><strong>Unit 2 Data and Analysis (ICT)</strong></div><div class="meta-card"><span>Issue Date</span><strong>Not issued</strong></div><div class="meta-card"><span>Certificate ID</span><strong>Pending verified issuance</strong></div></div></div><div class="bottom"><div class="verify"><strong>Verification</strong>Unit 2 verification will be available once authoritative grading and registry issuance have been enabled. No certificate record is created by this preview.</div><div class="sig"><div class="sig-line"></div><strong>Enamul Haque</strong><span>Proposed issuer<br/>Enamul Haque Skill Passport</span></div></div><div class="footer"><strong>Recognition Note:</strong> This preview is not a university degree, academic credit, or an externally accredited professional qualification. It is not an issued certificate.</div></div></section>';
})();
</script>
